# Compila el APK de Android (Capacitor) y lo publica en Releases.
# Necesita el secreto MF_FIRMA (contraseña de 32 caracteres + llave en base64). Nunca va en el repo.
# Si falla, deja el final del registro como comentario en el commit (para revisarlo sin abrir Actions).
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Compilar APK firmado
        env:
          MF_FIRMA: ${{ secrets.MF_FIRMA }}
          MF_VERSION_CODE: ${{ github.run_number }}
          MF_VERSION_NAME: 1.${{ github.run_number }}
        run: bash android-app/compilar.sh 2>&1 | tee "$RUNNER_TEMP/log.txt"
        shell: bash -o pipefail {0}

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" "$RUNNER_TEMP/mis-finanzas-1.${{ github.run_number }}.apk" \
            --title "Mis finanzas Android 1.${{ github.run_number }}" \
            --notes "APK para instalar en el celular. Commit ${GITHUB_SHA::7}." --latest

      - name: Dejar el error en el commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "❌ Falló la compilación del APK (run ${{ github.run_number }}). Últimas líneas:"; echo '```'; tail -n 60 "$RUNNER_TEMP/log.txt" 2>/dev/null || echo "(sin registro)"; echo '```'; } > "$RUNNER_TEMP/c.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/c.md"
