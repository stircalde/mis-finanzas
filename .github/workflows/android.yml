# Compila el APK de Android (Capacitor) y lo publica en Releases.
# Necesita el secreto MF_FIRMA (línea 1: contraseña; línea 2: llave en base64). Nunca va en el repo.
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Capacitor
        run: npm ci --no-audit --no-fund

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Preparar la llave de firma
        env:
          MF_FIRMA: ${{ secrets.MF_FIRMA }}
        run: |
          if [ -z "$MF_FIRMA" ]; then
            echo "::error::Falta el secreto MF_FIRMA (Settings > Secrets and variables > Actions)."; exit 1
          fi
          printf '%s\n' "$MF_FIRMA" | head -n 1 | tr -d '\r\n' > "$RUNNER_TEMP/pass"
          printf '%s\n' "$MF_FIRMA" | tail -n +2 | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/mf.jks"
          echo "MF_KEYSTORE=$RUNNER_TEMP/mf.jks" >> "$GITHUB_ENV"
          echo "MF_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/pass")" >> "$GITHUB_ENV"
          echo "MF_KEY_PASSWORD=$(cat "$RUNNER_TEMP/pass")" >> "$GITHUB_ENV"
          echo "MF_KEY_ALIAS=misfinanzas" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat "$RUNNER_TEMP/pass")"

      - name: Compilar APK firmado
        working-directory: android-app/android
        env:
          MF_VERSION_CODE: ${{ github.run_number }}
          MF_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mis-finanzas-1.${{ github.run_number }}.apk"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" "$RUNNER_TEMP/mis-finanzas-1.${{ github.run_number }}.apk" \
            --title "Mis finanzas Android 1.${{ github.run_number }}" \
            --notes "APK para instalar en el celular. Commit ${GITHUB_SHA::7}." --latest
