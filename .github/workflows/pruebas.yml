name: Pruebas del backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correr pruebas (regresiones contra tests/conocidos.json y tests/instantanea.json)
        run: node tests/correr.js
